<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-title" content="Transactions">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Transactions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1c1c1e; --muted:#8a8a8e; --line:#ebe9e4;
    --accent:#1c1c1e;
    --c-Shashank:#2f6fdb; --c-Balendu:#d9822b; --c-Raja:#2e9e6a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;
       padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px}
  h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .total{margin-top:18px;background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line)}
  .total .lbl{font-size:13px;color:var(--muted)}
  .total .amt{font-size:34px;font-weight:700;letter-spacing:-1px;margin-top:2px}
  .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:14px;background:var(--line)}
  .bar span{display:block;height:100%;transition:width .3s}
  .people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;cursor:pointer}
  .p.active{outline:2px solid var(--ink)}
  .p .name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .p .val{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
  .p .cnt{font-size:12px;color:var(--muted);margin-top:2px}
  .sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 8px}
  .sec h2{font-size:15px;font-weight:600}
  .sec button{border:0;background:none;color:var(--muted);font-size:13px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .av{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .mid{flex:1;min-width:0}
  .mid .what{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mid .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .row .amt{font-weight:600;font-size:15px}
  .del{border:0;background:none;color:#c7c7cc;font-size:20px;padding:0 0 0 6px;line-height:1}
  .day{font-size:12px;color:var(--muted);padding:10px 14px 6px;background:#fbfaf8;border-bottom:1px solid var(--line);font-weight:600}
  .empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;
       border:0;background:var(--accent);color:#fff;font-size:34px;font-weight:300;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
         padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:520px;margin:0 auto}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet h3{font-size:18px;margin-bottom:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{padding:11px 0;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--ink)}
  .seg button.on{color:#fff;border-color:transparent}
  .amtin{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
  .amtin span{font-size:24px;color:var(--muted);margin-right:4px}
  input{width:100%;border:0;outline:0;font:inherit;background:transparent;color:var(--ink)}
  .amtin input{font-size:28px;font-weight:700;padding:10px 0}
  .txt{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
  .amtin:focus-within,.txt:focus{border-color:var(--ink)}
  .submit{width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;margin-top:4px}
  .submit:disabled{opacity:.4}
  .toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:12px;font-size:14px;transition:transform .25s;z-index:10}
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Transactions</h1>
  <div class="sub" id="sub">Shashank · Balendu · Raja</div>

  <div class="total">
    <div class="lbl">Total spent</div>
    <div class="amt" id="grand">₹0</div>
    <div class="bar" id="bar"></div>
  </div>

  <div class="people" id="people"></div>

  <div class="sec">
    <h2 id="listTitle">All transactions</h2>
    <button id="clearFilter" style="display:none">Show all</button>
  </div>
  <div class="list" id="list"><div class="empty">Loading…</div></div>
</div>

<button class="fab" id="fab" aria-label="Add transaction">+</button>

<div class="sheet-bg" id="bg"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="grab"></div>
  <h3>Add transaction</h3>
  <div class="field">
    <label>Who paid</label>
    <div class="seg" id="who"></div>
  </div>
  <div class="field">
    <label>How much</label>
    <div class="amtin"><span>₹</span><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0"></div>
  </div>
  <div class="field">
    <label>For what</label>
    <input class="txt" id="note" type="text" placeholder="e.g. Petrol, dinner, groceries" maxlength="120">
  </div>
  <button class="submit" id="submit" type="submit" disabled>Submit</button>
</form>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://uzflymfutbjfkdcutsif.supabase.co";
const SUPABASE_KEY = "sb_publishable_WcuSiUrPHKTNt6fDXmyQAw_WDq901On";
const TABLE = "shared_transactions";
const PEOPLE = ["Shashank","Balendu","Raja"];
const color = p => getComputedStyle(document.documentElement).getPropertyValue("--c-"+p).trim();

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let rows = [];
let filter = null;
let who = null;
try { who = localStorage.getItem("txn_who"); } catch(e){}
if (!PEOPLE.includes(who)) who = null;

const $ = id => document.getElementById(id);
const inr = n => "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:2});
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }

function render(){
  const totals = Object.fromEntries(PEOPLE.map(p=>[p,0]));
  const counts = Object.fromEntries(PEOPLE.map(p=>[p,0]));
  rows.forEach(r=>{ totals[r.person]+=Number(r.amount); counts[r.person]++; });
  const grand = PEOPLE.reduce((s,p)=>s+totals[p],0);
  $("grand").textContent = inr(grand);
  $("bar").innerHTML = grand ? PEOPLE.map(p=>`<span style="width:${totals[p]/grand*100}%;background:${color(p)}"></span>`).join("") : "";
  $("people").innerHTML = PEOPLE.map(p=>`
    <div class="p ${filter===p?'active':''}" data-p="${p}">
      <div class="name"><span class="dot" style="background:${color(p)}"></span>${p}</div>
      <div class="val">${inr(totals[p])}</div>
      <div class="cnt">${counts[p]} item${counts[p]===1?'':'s'}</div>
    </div>`).join("");
  document.querySelectorAll(".p").forEach(el=>el.onclick=()=>{ filter = filter===el.dataset.p ? null : el.dataset.p; render(); });

  $("listTitle").textContent = filter ? `${filter}'s transactions` : "All transactions";
  $("clearFilter").style.display = filter ? "" : "none";

  const shown = rows.filter(r=>!filter || r.person===filter);
  if (!shown.length){ $("list").innerHTML = `<div class="empty">No transactions yet. Tap + to add one.</div>`; return; }
  let html = "", lastDay = "";
  shown.forEach(r=>{
    const d = new Date(r.created_at);
    const day = d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    if (day!==lastDay){ html += `<div class="day">${day}</div>`; lastDay = day; }
    const time = d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
    html += `<div class="row">
      <div class="av" style="background:${color(r.person)}">${r.person[0]}</div>
      <div class="mid"><div class="what">${esc(r.note||"—")}</div><div class="meta">${r.person} · ${time}</div></div>
      <div class="amt">${inr(r.amount)}</div>
      <button class="del" data-id="${r.id}" aria-label="Delete">×</button>
    </div>`;
  });
  $("list").innerHTML = html;
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>removeRow(b.dataset.id));
}

async function load(){
  const { data, error } = await sb.from(TABLE).select("*").order("created_at",{ascending:false});
  if (error){ $("list").innerHTML = `<div class="empty">Couldn't load: ${esc(error.message)}</div>`; return; }
  rows = data; render();
}

async function removeRow(id){
  const r = rows.find(x=>x.id===id); if(!r) return;
  if (!confirm(`Delete ${inr(r.amount)} – ${r.note||"transaction"} (${r.person})?`)) return;
  const { error } = await sb.from(TABLE).delete().eq("id", id);
  if (error) return toast("Delete failed");
  rows = rows.filter(x=>x.id!==id); render(); toast("Deleted");
}

// Sheet
function renderWho(){
  $("who").innerHTML = PEOPLE.map(p=>`<button type="button" class="${who===p?'on':''}" data-p="${p}" style="${who===p?`background:${color(p)}`:''}">${p}</button>`).join("");
  document.querySelectorAll("#who button").forEach(b=>b.onclick=()=>{ who=b.dataset.p; try{localStorage.setItem("txn_who",who)}catch(e){}; renderWho(); validate(); });
}
function validate(){ $("submit").disabled = !(who && Number($("amount").value) > 0); }
function openSheet(){ renderWho(); validate(); $("bg").classList.add("open"); $("sheet").classList.add("open"); setTimeout(()=>$("amount").focus(), 250); }
function closeSheet(){ $("bg").classList.remove("open"); $("sheet").classList.remove("open"); document.activeElement.blur(); }
$("fab").onclick = openSheet;
$("bg").onclick = closeSheet;
$("clearFilter").onclick = ()=>{ filter=null; render(); };
$("amount").oninput = validate;

$("sheet").onsubmit = async e=>{
  e.preventDefault();
  const amount = Number($("amount").value);
  if (!who || !(amount>0)) return;
  $("submit").disabled = true;
  const { data, error } = await sb.from(TABLE).insert({ person: who, amount, note: $("note").value.trim() }).select().single();
  if (error){ toast("Couldn't save – try again"); validate(); return; }
  if (!rows.some(x=>x.id===data.id)) rows.unshift(data);
  render();
  $("amount").value = ""; $("note").value = "";
  closeSheet(); toast("Added " + inr(amount));
};

// Live sync between phones
sb.channel("txn").on("postgres_changes", { event:"*", schema:"public", table:TABLE }, p=>{
  if (p.eventType==="INSERT" && !rows.some(x=>x.id===p.new.id)) rows.unshift(p.new);
  if (p.eventType==="DELETE") rows = rows.filter(x=>x.id!==p.old.id);
  rows.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  render();
}).subscribe();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) load(); });

load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
